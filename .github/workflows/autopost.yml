name: Autopost

# Picks news, writes the post, renders the image and publishes (or sends to Telegram for review).
on:
  schedule:
    - cron: '7 */2 * * *' # every 2 hours (UTC), at minute 7
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (send the result to Telegram only, do not publish or save anything)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATE_API_URL: ${{ secrets.STATE_API_URL }}
      STATE_API_TOKEN: ${{ secrets.STATE_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN }}
      MIN_SCORE: ${{ vars.MIN_SCORE }}
      MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS }}
      REVIEW_LEVEL: ${{ vars.REVIEW_LEVEL }}
      SOURCE_CREDIT: ${{ vars.SOURCE_CREDIT }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || vars.DRY_RUN }}
      # Use the Chrome that is preinstalled on GitHub's Ubuntu runners
      CHROMIUM_PATH: /usr/bin/google-chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: sudo apt-get install -y -qq fonts-liberation >/dev/null
      - run: node src/index.js --once
