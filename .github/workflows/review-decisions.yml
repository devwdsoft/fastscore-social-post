name: Review decisions

# Acts on Telegram Approve / Reject presses for drafts waiting for review.
on:
  schedule:
    - cron: '37 * * * *' # every hour (UTC), at minute 37
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopost-state
  cancel-in-progress: false

jobs:
  decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: ${{ vars.DRY_RUN }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/state.sh pull
      - id: check
        run: |
          n=$(jq '.pending | length' data/state.json 2>/dev/null || echo 0)
          echo "pending=$n" >> "$GITHUB_OUTPUT"
          echo "$n draft(s) waiting for review"
      - if: steps.check.outputs.pending != '0'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.check.outputs.pending != '0'
        run: npm install --no-audit --no-fund
      - if: steps.check.outputs.pending != '0'
        run: node src/index.js --decisions
      - if: always() && steps.check.outputs.pending != '0'
        run: bash scripts/state.sh push
